<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AICS - CSWDO Mabalacat</title>
<style>
:root{--navy:#17365d;--ink:#1c2430;--mute:#65707e;--line:#d5dbe3;--bg:#eef1f5;--card:#fff;--gold:#c9a227;--ok:#1f7a4d}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 12px;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--navy);padding:12px 14px}
.stat b{display:block;font-size:24px}.stat span{color:var(--mute)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.bar{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.bar i{display:block;height:12px;background:var(--navy);border-radius:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 14px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
input,select,textarea{width:100%;padding:7px 8px;border:1px solid #b9c2ce;border-radius:4px;font:inherit;background:#fff}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:0}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink)}.chk input{width:auto}
.btn{background:var(--navy);color:#fff;border:0;padding:9px 16px;border-radius:4px;font:inherit;cursor:pointer}
.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}.btn.red{background:#a33}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:#f3f5f8;text-align:left;padding:7px;border-bottom:2px solid var(--line)}
table.t td{padding:7px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}

/* ===== Layout: left sidebar ===== */
#side{position:fixed;inset:0 auto 0 0;width:248px;background:linear-gradient(180deg,#12294a,#17365d 60%,#0f2340);color:#cfd9e8;display:flex;flex-direction:column;border-right:4px solid var(--gold);z-index:5;overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;padding:18px 16px;border-bottom:1px solid #ffffff1f}
.brand .seal{width:44px;height:44px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;box-shadow:0 0 0 3px #ffffff2a}
.brand b{display:block;color:#fff;font-size:17px;letter-spacing:.5px}
.brand span{font-size:11px;color:#9fb2cc;line-height:1.3;display:block}
nav{display:flex;flex-direction:column;gap:3px;padding:14px 10px}
nav button{display:flex;align-items:center;gap:12px;background:none;border:0;border-left:3px solid transparent;color:#cfd9e8;padding:11px 12px;border-radius:6px;font:inherit;cursor:pointer;text-align:left}
nav button svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{background:#ffffff14;color:#fff}
nav button.on{background:#ffffff22;color:#fff;border-left-color:var(--gold);font-weight:600}
#side .foot{padding:14px 16px;font-size:11px;color:#9fb2cc;border-top:1px solid #ffffff1f}
#side .foot b{color:var(--gold);display:block;font-size:12px}
main{margin-left:248px;padding:22px 28px 40px;max-width:1320px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid var(--line)}
.top h1{margin:0;font-size:25px;color:var(--navy);font-weight:700}
.top p{margin:2px 0 0;color:var(--mute)}
#clock{color:var(--mute);font-size:13px;text-align:right}

/* ===== Cards, stats, tables ===== */
.card{border-radius:10px;box-shadow:0 1px 3px #1a2b4a1a;border-top:3px solid var(--navy)}
h2{padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.stats .stat{display:flex;gap:13px;align-items:center;border:1px solid var(--line);border-left:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:0 1px 3px #1a2b4a14}
.stat em{font-style:normal;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex:none}
.stat b{font-size:22px;line-height:1.15}
.stat.s0 em{background:#e1eaf7}.stat.s1 em{background:#fbefcc}.stat.s2 em{background:#dcf2e6}
.stat.s3 em{background:#f6dfe6}.stat.s4 em{background:#e6e1f7}.stat.s5 em{background:#d9eff2}
.bar i{background:linear-gradient(90deg,var(--navy),#4a78b5);border-radius:6px}
.bar{grid-template-columns:170px 1fr 34px}
table.t tr:hover td{background:#f6f9fd}
table.t td:first-child{font-weight:600;color:var(--navy);white-space:nowrap}
table.t th{color:var(--navy);font-size:12px}
.btn{border-radius:6px;font-weight:600;transition:filter .15s}.btn:hover{filter:brightness(1.12)}
input,select{transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 3px #c9a22744}
@media(max-width:860px){
  #side{position:static;width:auto;flex-direction:row;align-items:center;flex-wrap:wrap;border-right:0;border-bottom:4px solid var(--gold)}
  .brand{border:0;padding:10px 14px}
  nav{flex-direction:row;padding:0 8px 8px;flex:1 1 100%;overflow-x:auto}
  nav button{padding:8px 12px;border-left:0;border-bottom:3px solid transparent;white-space:nowrap}
  nav button.on{border-bottom-color:var(--gold)}
  #side .foot{display:none}
  main{margin-left:0;padding:16px 12px 30px}
  .bar{grid-template-columns:110px 1fr 30px}
}

.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.cat{background:#fff;border:2px solid var(--line);border-top:5px solid var(--navy);border-radius:12px;padding:24px 18px;text-align:left;cursor:pointer;font:inherit;transition:transform .15s,border-color .15s,box-shadow .15s}
.cat:hover{border-color:var(--gold);border-top-color:var(--gold);transform:translateY(-3px);box-shadow:0 6px 16px #1a2b4a22}
.cat i{font-style:normal;font-size:32px;display:block;margin-bottom:10px}
.cat b{display:block;font-size:18px;color:var(--navy);margin-bottom:4px}
.cat span{color:var(--mute);font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}

.chks{display:flex;flex-wrap:wrap;gap:6px 18px;padding:4px 0}
textarea{resize:vertical}
.mute{color:var(--mute);margin:0 0 8px}
.doc{width:8.5in;margin:0 auto;background:#fff;color:#000;font:10px/1.3 Arial,sans-serif;padding:0 .12in}
.doc table{width:100%;border-collapse:collapse}
.doc td,.doc th{border:1px solid #000;padding:2px 4px;vertical-align:top;text-align:left}
.doc th{background:#eee;font-size:9px}
.doc small{display:block;font-size:8px;color:#333}
.doc .sec{background:#000;color:#fff;font-weight:bold;padding:3px 6px;margin-top:5px;font-size:11px}
.doc .nb td{border:0;padding:1px 2px}
.doc.cs{font-size:12px;line-height:1.45}
.doc.cs h2{text-align:center;margin:10px 0 0;font-size:16px}
.doc.cs h4{margin:12px 0 3px;font-size:12px}
.doc.cs p{white-space:pre-wrap;text-align:justify;margin:4px 0 8px;text-indent:.4in}

/* ===== Notifications: navy toasts and dialogs ===== */
#toasts{position:fixed;top:18px;right:18px;display:flex;flex-direction:column;gap:10px;z-index:350;width:min(360px,calc(100vw - 36px))}
.tt{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,#12294a,#17365d);color:#e8eef7;border-radius:12px;padding:13px 14px;border-left:5px solid var(--gold);box-shadow:0 12px 30px #0b1d3a66;font-size:13.5px;line-height:1.4;animation:tin .25s ease-out}
.tt i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;background:#ffffff22;color:#fff}
.tt b{display:block;color:#fff;font-size:13px;letter-spacing:.3px;margin-bottom:1px}
.tt.ok{border-left-color:#3ecf8e}.tt.ok i{background:#3ecf8e33;color:#7ff0bd}
.tt.err{border-left-color:#ff6b70}.tt.err i{background:#ff6b7033;color:#ffb0b3}
.tt button{margin-left:auto;background:none;border:0;color:#9fb2cc;font-size:20px;line-height:1;cursor:pointer;padding:0 2px}
.tt button:hover{color:#fff}
@keyframes tin{from{transform:translateX(34px);opacity:0}to{transform:none;opacity:1}}
#modal{position:fixed;inset:0;background:#0b1d3acc;display:none;align-items:center;justify-content:center;z-index:400;padding:16px;backdrop-filter:blur(2px)}
.mbox{background:#fff;border-radius:14px;width:100%;max-width:430px;overflow:hidden;box-shadow:0 24px 60px #000a;animation:mpop .2s ease-out}
.mhead{background:linear-gradient(135deg,#12294a,#17365d);color:#fff;padding:16px 18px;display:flex;gap:12px;align-items:center;border-bottom:3px solid var(--gold)}
.mhead i{flex:none;width:38px;height:38px;border-radius:50%;background:#ffffff22;display:grid;place-items:center;font-style:normal;font-size:18px;font-weight:700}
.mhead b{font-size:16px}
.mbody{padding:20px 18px 16px;color:var(--ink);line-height:1.55;white-space:pre-line;font-size:14px}
.mfoot{padding:0 18px 18px;display:flex;gap:8px;justify-content:flex-end}
@keyframes mpop{from{transform:scale(.94) translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* ===== Sign-in gate, user chip, roles ===== */
#gate{position:fixed;inset:0;background:radial-gradient(circle at 20% 15%,#24508a,#12294a 55%,#0b1d3a);display:flex;align-items:center;justify-content:center;z-index:300;padding:16px}
.gbox{background:#fff;border-radius:16px;width:100%;max-width:470px;overflow:hidden;box-shadow:0 24px 60px #000a}
.ghead{background:linear-gradient(135deg,#12294a,#17365d);color:#fff;padding:20px;display:flex;gap:14px;align-items:center;border-bottom:4px solid var(--gold)}
.ghead .seal{width:50px;height:50px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.ghead b{display:block;font-size:16px}.ghead span{font-size:13px;color:#b9c8de}
.gbody{padding:20px;line-height:1.55}
.gbody .gmail{background:#eef3fa;border-radius:8px;padding:8px 12px;margin:0 0 12px}
.gbody .gform label{margin-top:8px}
.gbody a{color:var(--navy);font-weight:600}
.gbody .gl2{font-size:12px;color:var(--mute);margin:14px 0 0}
.me{margin:auto 10px 10px;padding:12px;border-radius:10px;background:#ffffff14;font-size:12px;color:#cfd9e8;display:none}
.me b{display:block;color:#fff;font-size:13px}.me small{display:block;margin:3px 0 6px;word-break:break-all}
.me a{color:var(--gold);font-size:11px}
.role{display:inline-block;margin:3px 0;padding:1px 8px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:#ffffff26;color:#fff}
.role.rSUPER{background:var(--gold);color:var(--navy)}.role.rADMIN{background:#4a78b5}
#side .foot{margin-top:0}

/* ===== Guarantee letter ===== */
#gl{display:none}
.gl{width:8.5in;margin:0 auto;background:#fff;color:#000;font-family:Arial,sans-serif;font-size:11px;padding:0}
.gl img.hf{width:100%;display:block}
.gl .ph{height:.9in;background:#e8ecf2;display:flex;align-items:center;justify-content:center;color:#888}
.gl .body{padding:6px 14px}
.gl h3{text-align:center;color:#1a1ac8;font-size:20px;margin:8px 0;border:1px solid #000;padding:4px}
.gl table{width:100%;border-collapse:collapse}
.gl td,.gl th{border:1px solid #000;padding:2px 6px}
.gl .bar2{background:#1d3b5c;color:#fff;text-align:center;font-weight:bold;letter-spacing:1px;margin-top:6px;padding:2px}
.gl .big{font-size:14px;font-weight:bold}
.gl .svc td{font-weight:bold;height:17px}
.gl .qr{width:150px;height:150px;display:block;margin:auto}
.gl .ftw{position:relative;width:100%;padding-bottom:12.6%;overflow:hidden;margin-top:6px}
.gl .ftw img{position:absolute;left:0;bottom:0;width:100%}
.gl .qrw{position:relative;width:150px;height:150px;margin:auto}
.gl .qrl{position:absolute;left:50%;top:50%;width:72px;transform:translate(-50%,-50%)}
.gl .sig{display:flex;justify-content:space-between;margin-top:22px;text-align:center}
.gl .sig div{width:46%;border-top:1px solid #000;font-weight:bold;padding-top:2px}
.gl .amt{color:#1a1ac8;font-weight:bold}
@media print{
  @page{size:8.5in 13in;margin:.25in}
  body{background:#fff}
  aside,main,#toasts,#modal{display:none!important}
  #gl{display:block!important}
}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><div class="seal">AICS</div><div><b>AICS</b><span>CSWDO · Mabalacat City<br>Assistance to Individuals in Crisis Situation</span></div></div>
  <nav>
    <button data-v="dash" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard</button>
    <button data-v="assess"><svg viewBox="0 0 24 24"><path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1z"/><path d="M8 6H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-2M8 12h8M8 16h5"/></svg>Assessment</button>
    <button data-v="entry"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v6M9 15h6"/></svg>Guarantee letter</button>
    <button data-v="recs"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Records</button>
    <button data-v="dir"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>Directory</button>
    <button data-v="users" id="navUsers" style="display:none"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>Users &amp; access</button>
  </nav>
  <div class="me" id="meBox"></div>
  <div class="foot" style="margin-top:auto"><b>Serbisyong Tuloy-Tuloy</b>Mabalacat City Government</div>
</aside>

<main>
  <div class="top"><div><h1 id="pageTitle">Dashboard</h1><p id="pageSub">Overview of assistance issued</p></div><div id="clock"></div></div>
  <section id="dash" class="view on">
    <div class="stats" id="stats"></div>
    <div class="stats" id="catStats"></div>
    <div class="cols">
      <div class="card"><h2>By type of assistance</h2><div id="byType"></div></div>
      <div class="card"><h2>Top barangays</h2><div id="byBrgy"></div></div>
    </div>
    <div class="card"><h2>Latest guarantee letters</h2><div class="scroll" id="recent"></div></div>
  </section>

  <section id="assess" class="view">
    <div id="asList"></div>
    <div id="asForm" style="display:none"></div>
    <div id="asDone" style="display:none"></div>
  </section>

  <section id="entry" class="view">
    <div id="pick"></div>
    <div id="formWrap" style="display:none"></div>
  </section>

  <section id="recs" class="view">
    <div class="card">
      <div id="recTabs" class="tabs" style="margin-bottom:10px"></div>
      <input id="q" placeholder="Search by name, control #, barangay, hospital...">
      <div class="scroll" style="margin-top:10px" id="list"></div>
    </div>
  </section>
  <section id="dir" class="view">
    <div class="card"><div id="dirTabs" class="row" style="margin:0"></div></div>
    <div class="card" id="dirFormCard"><h2 id="dirTitle"></h2><div class="grid" id="dirForm"></div>
      <div class="row"><button class="btn" id="dirSave">Save</button><button class="btn alt" id="dirClear">Clear form</button></div></div>
    <div class="card"><input id="dq" placeholder="Search this list..."><div class="scroll" style="margin-top:10px" id="dirList"></div></div>
  </section>
  <section id="users" class="view">
    <div class="card"><div id="usersTabs" class="tabs"></div></div>
    <div id="usersBody"></div>
  </section>
</main>
<div id="toasts"></div>
<div id="modal"></div>
<div id="gate"></div>
<div id="gl"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TOKEN='';try{TOKEN=localStorage.getItem('aicsTok')||''}catch(e){}   // stays signed in on this device
const saveTok=t=>{TOKEN=t||'';try{t?localStorage.setItem('aicsTok',t):localStorage.removeItem('aicsTok')}catch(e){}};
/* Where the Apps Script back end lives. Used only when this page is hosted outside Google (GitHub Pages / Netlify). */
const API_URL='https://script.google.com/macros/s/AKfycbw9bi4AZtQ4W35K_o9QeWmZ7H2efZj9tKa7NTYUqUzvbsJ3FHmnqG_iEmLDBpbO-CwVkg/exec';
const INSIDE_GOOGLE=typeof google!=='undefined'&&google.script&&google.script.run;
const raw=(fn,...a)=>INSIDE_GOOGLE
  ?new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a))
  :fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({rpc:fn,args:a})})   // text/plain = no CORS preflight
    .then(r=>r.json().catch(()=>{throw new Error('The server did not answer correctly. Check that the latest Code.gs is deployed as a New version.')}))
    .then(j=>{if(!j.ok)throw new Error(j.error||'Request failed');return j.result});   // public calls (sign-in, request access)
const run=(fn,...a)=>raw('api',TOKEN,fn,a).catch(e=>{   // every other call carries the sign-in token
  if(/SESSION_EXPIRED/.test((e&&e.message)||'')){saveTok('');ME={};gate('login','Your session ended. Please sign in again.');throw new Error('Session ended. Please sign in again.')}
  throw e});
let S={types:[],records:[],images:{}};
const today=()=>{const d=new Date(),p=n=>('0'+n).slice(-2);return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});

/* ---------- Field definitions: [key, label, type, options] ---------- */
const GENDER=['Male','Female'],CIVIL=['Single','Married','Widowed','Separated','Live-in'];
const F_A=[['TypeOfAssistance','Type of assistance','ro'],['ControlID','Control ID (auto)','ro'],['DateToday','Date','date'],['Status','Status','select',['Approved','Pending','Released','Cancelled']]];
const F_C=[['LastName','Last name'],['FirstName','First name'],['MiddleName','Middle name'],['ExtName','Ext. name (Sr/Jr/I/II/III)'],
['DOB','Date of birth','date'],['Age','Age','ro'],['BirthPlace','Birth place'],['Gender','Gender','select',GENDER],['CivilStatus','Civil status','select',CIVIL],
['Street','House / Block / Lot no. / Street'],['Barangay','Barangay'],['City','City / Municipality','text','Mabalacat City'],
['Religion','Religion'],['Occupation','Occupation'],['Contact','Contact number'],['MotherMaidenName',"Mother's maiden name"],
['MonthlyIncome','Monthly family net income','number'],['RelationToPatient','Relation to the patient'],['IDNumber','ID card number']];
const F_P=[['PatientName','Name of patient'],['ReferredTo','Hospital'],['ContactPerson','Contact person (auto from stakeholder)'],['Doctors','Doctor/s'],['PatientAge','Patient age','number'],
['PatientGender','Patient gender','select',GENDER],['AmountApproved','Approved amount / procedure (₱)','number'],['AssessedBy','Assessed by'],
['PatientStreet','Patient house / block / lot no. / street'],['PatientBarangay','Barangay'],['PatientCity','City / Municipality','text','Mabalacat City']];
const SVC=[['MRI','MRI'],['CTScan','CT Scan'],['Echo2D','2D Echo'],['Ultrasound','Ultrasound'],['Chemotherapy','Chemotherapy'],['Tomotherapy','Tomotherapy'],
['Brachytherapy','Brachytherapy'],['Radiation','Radiation'],['HospitalBill','Hospital Bill'],['Laboratory','Laboratory'],['Implant','Implant']];
const F_G=[['ExpirationDate','Expiration date','date']];
const F_R=[['MRIResult','MRI result'],['CTScanResult','CT Scan result'],['Echo2DResult','2D Echo result'],['UltrasoundResult','Ultrasound result']];
const SIGN={CrisisUnitHead:'KHRISTINE CAROLE L. GANTAN,RSW',CSWDOHead:'JOSEPHINE B. TANGLAO,RSW MMPM',Mayor:'HON. GERALD GUTTRIE P. AQUINO'}; // edit names here

function fieldHTML([k,l,t='text',o]){
  if(t==='select'){const opts=o==='TYPES'?S.types.map(x=>x[0]):o;return `<div><label>${l}</label><select id="${k}"><option value=""></option>${opts.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>`}
  return `<div><label>${l}</label><input id="${k}" type="${t==='ro'?'text':t}" ${t==='ro'?'readonly':''} value="${typeof o==='string'&&t!=='select'?esc(o):''}"></div>`;

const F_DEC=[['DeceasedLastName','Last name'],['DeceasedFirstName','First name'],['DeceasedMiddleName','Middle name'],['DeceasedExtName','Ext. name (Sr/Jr/I/II/III)'],
['DeceasedDOB','Date of birth','date'],['DateOfDeath','Date of death','date'],['DeceasedAge','Age at death','ro'],['DeceasedGender','Gender','select',GENDER],
['DeceasedCivilStatus','Civil status','select',CIVIL],['CauseOfDeath','Cause of death'],['DeathCertNo','Death certificate no.'],

const ICON={MEDLAB:'🧪',MEDHOS:'🏥',BURIAL:'🕊️'};
let cat=null,ALL=[],recCat='ALL',curCase=null,glCase='',asCur=null;
const dname=r=>[r.DeceasedLastName+',',r.DeceasedFirstName,r.DeceasedMiddleName,r.DeceasedExtName].filter(Boolean).join(' ');
const subj=r=>r.Category==='BURIAL'?dname(r):(r.PatientName||fullName(r));
const card=(t,b)=>`<div class="card"><h2>${t}</h2>${b}</div>`;

function lettersHTML(c){   // existing guarantee letters of this client: editable even while a category is locked
  const id=ident(c),L=S.records.filter(r=>r.CaseNo===c.CaseNo||ident(r)===id).sort((a,b)=>(b.DateToday||'').localeCompare(a.DateToday||''));
  if(!L.length)return '';
  return `<h2 style="margin-top:20px">Guarantee letters of this client</h2><p class="mute">Correct a letter here, even if its category is locked. Only the guarantee letter changes; the assessment and case study stay as they are.</p>
  <div class="scroll"><table class="t"><tr><th>Control #</th><th>Category</th><th>Amount</th><th>Date</th><th>Status</th><th></th></tr>${L.map(r=>`<tr><td>${esc(r.ControlID)}</td><td>${esc(r.TypeOfAssistance)}</td><td>${money(r.AmountApproved)}</td><td>${esc(r.DateToday)}</td><td>${esc(r.Status)}</td>
  <td style="white-space:nowrap">${mine(r)?`<button class="btn" data-e="${esc(r.ControlID)}">Edit letter</button>`:''} <button class="btn alt" data-p="${esc(r.ControlID)}">Print</button></td></tr>`).join('')}</table></div>`;
}
function casePanel(c,inEntry){
  const g=c.Generated||'',ok=true;   // documents are optional; they no longer gate the guarantee letter
  return `<div class="card"><h2>Case ${esc(c.CaseNo)} · ${esc(fullName(c))}</h2>
  <p class="mute"><b>Step 1 (optional)</b> – print the General Intake Sheet, Case Study or Certification if needed.</p>
  <div class="row" style="margin:0 0 6px"><button class="btn" data-gen="intake" data-cn="${esc(c.CaseNo)}">Generate General Intake Sheet</button>
   <button class="btn" data-gen="study" data-cn="${esc(c.CaseNo)}">Generate Case Study</button>
   <button class="btn" data-gen="cert" data-cn="${esc(c.CaseNo)}">Generate Certification</button>
   ${mine(c)?`<button class="btn alt" data-ae="${esc(c.CaseNo)}">Edit assessment</button>`:''}
   ${inEntry?'<button class="btn alt" data-sel="">Change case</button>':'<button class="btn alt" data-v="assess">Back to list</button>'}</div>
  <p class="mute">Generated so far: <b>${esc(g)||'nothing yet'}</b></p>
  <p class="mute" style="margin-top:14px"><b>Step 2</b> – choose the guarantee letter category. The form is filled in from this assessment. Each category can be availed once every ${S.gap||3} months per client, counted separately.</p>
  <div class="cats">${Object.entries(S.cats).map(([k,ct])=>{const e=eligibility(c,k,''),on=ok&&e.ok,
   sub=!ok?'Generate a document first':!e.ok?'Not eligible until '+longDate(e.next)+' · last availed '+longDate(e.last.DateToday):e.last?'Eligible · last availed '+longDate(e.last.DateToday):'Eligible · no previous availment';
   return `<button class="cat" data-c="${k}" data-cn="${esc(c.CaseNo)}" style="${on?'':'opacity:.45'}"><i>${ICON[k]}</i><b>${ct.label}</b><span>${sub}</span></button>`}).join('')}</div>${lettersHTML(c)}</div>`;
}
function caseRows(){
  const q=($('cq')?$('cq').value:'').toLowerCase(),L=S.intakes.filter(c=>!q||(c.CaseNo+' '+fullName(c)).toLowerCase().includes(q));
  $('caseList').innerHTML=L.length?'<table class="t"><tr><th>Case no.</th><th>Client</th><th>Case category</th><th>Documents</th><th></th></tr>'+
   L.map(c=>`<tr><td>${esc(c.CaseNo)}</td><td>${esc(fullName(c))}</td><td>${esc(c.CaseCategory)}</td><td>${esc(c.Generated)||'-'}</td><td><button class="btn" data-sel="${esc(c.CaseNo)}">Select</button></td></tr>`).join('')+'</table>'
   :'<p class="mute">No assessed cases yet. Create an assessment first.</p>';
}
function pick(){
  $('formWrap').style.display='none';$('pick').style.display='block';
  if(curCase){$('pick').innerHTML=casePanel(curCase,true);return}
  $('pick').innerHTML='<div class="card"><h2>Select an assessed case</h2><p class="mute">A guarantee letter is based on the social worker\'s assessment. Pick the case, or create a new assessment.</p><div class="row" style="margin:0 0 10px"><input id="cq" placeholder="Search case no. or client name" style="max-width:340px"><button class="btn alt" data-v="assess" data-an="1">New assessment</button></div><div class="scroll" id="caseList"></div></div>';
  $('cq').oninput=caseRows;caseRows();
}
function buildForm(k){  // step 2: the entry form for that category
  cat=k;const c=S.cats[k],bur=c.form==='bur';
  ALL=bur?[...F_A,...F_BEN,...F_DEC,...F_BG]:[...F_A,...F_C,...F_P,...F_G,...F_R];
  const grid=f=>`<div class="grid">${f.map(fieldHTML).join('')}</div>`;
  let x=`<div class="card"><div class="row" style="margin:0;align-items:center;justify-content:space-between"><h2 id="formTitle" style="border:0;margin:0;padding:0"></h2><button class="btn alt" id="chg">Change category</button></div><div class="grid" style="margin-top:12px">${F_A.map(fieldHTML).join('')}</div></div>`;
  x+=bur?card('Beneficiary information',grid(F_BEN))+card('Information of the deceased',grid(F_DEC))+card('Assistance details',grid(F_BG))
   :card('Client information',grid(F_C))
    +card('Medical information',`<label class="chk"><input type="checkbox" id="ClientIsPatient"> Client is the patient</label><div class="grid" style="margin-top:10px">${F_P.map(fieldHTML).join('')}</div>
      <h2 style="margin-top:16px">Disposition</h2><div class="grid">${SVC.map(([k,l])=>`<label class="chk"><input type="checkbox" id="${k}"> ${l}</label>`).join('')}${F_R.map(fieldHTML).join('')}${fieldHTML(['Others','Others (specify)'])}</div>`)
    +card('Approval',grid(F_G));
  x+='<div class="card"><div class="row" style="margin:0"><button class="btn" id="save">Save record</button><button class="btn alt" id="savePrint">Save and print letter</button><button class="btn alt" id="reset">Clear form</button></div></div>';
  $('formWrap').innerHTML=x;
  $('chg').onclick=pick;$('save').onclick=()=>save(false);$('savePrint').onclick=()=>save(true);$('reset').onclick=resetForm;
  $('DOB').onchange=calcAge;
  if(bur){$('DateOfDeath').onchange=$('DeceasedDOB').onchange=calcDec}else{$('ClientIsPatient').onchange=togglePatient}
  glCase=curCase?curCase.CaseNo:'';$('pick').style.display='none';$('formWrap').style.display='block';resetForm();lists();if(curCase)prefill(curCase);$('ReferredTo').oninput=$('ReferredTo').onchange=syncContact;window.scrollTo(0,0);
}
function syncContact(){   // hospital / funeral home picked from Stakeholders -> fill its contact person
  const n=$('ReferredTo').value.trim().toUpperCase(),s=S.dirs.Stakeholders.find(x=>(x.Name||'').trim().toUpperCase()===n);
  if(s)$('ContactPerson').value=s.ContactPerson||'';
}
function calcAge(){const d=$('DOB').value;if(!d){$('Age').value='';return}const b=new Date(d),n=new Date();let a=n.getFullYear()-b.getFullYear();
  if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;$('Age').value=a}
function calcDec(){const b=$('DeceasedDOB').value,d=$('DateOfDeath').value;if(!b||!d){$('DeceasedAge').value='';return}
  const x=new Date(b),y=new Date(d);let a=y.getFullYear()-x.getFullYear();if(y<new Date(y.getFullYear(),x.getMonth(),x.getDate()))a--;$('DeceasedAge').value=a>=0?a:''}
function togglePatient(){const on=$('ClientIsPatient').checked;
  ['PatientName','PatientAge','PatientGender','PatientStreet','PatientBarangay','PatientCity'].forEach(k=>$(k).closest('div').style.opacity=on?.4:1)}
function resetForm(){
  const c=S.cats[cat],bur=c.form==='bur';
  ALL.forEach(([k,,t,o])=>{const e=$(k);if(e)e.value=(t==='text'&&typeof o==='string')?o:''});
  if(!bur){SVC.forEach(([k])=>$(k).checked=false);$('Others').value='';$('ClientIsPatient').checked=false;togglePatient();
    if(cat==='MEDHOS')$('HospitalBill').checked=true;if(cat==='MEDLAB')$('Laboratory').checked=true}
  $('TypeOfAssistance').value=c.label;$('DateToday').value=today();$('Status').value='Approved';
  const x=new Date();x.setMonth(x.getMonth()+6);$('ExpirationDate').value=x.toISOString().slice(0,10);
  $('formTitle').textContent='New guarantee letter · '+c.label+(glCase?' · Case '+glCase:'');
}
function collect(){
  const bur=S.cats[cat].form==='bur',r={Category:cat,CaseNo:glCase};
  ALL.forEach(([k])=>r[k]=$(k).value.trim());
  ['LastName','FirstName','MiddleName'].concat(bur?['DeceasedLastName','DeceasedFirstName','DeceasedMiddleName']:[]).forEach(k=>r[k]=r[k].toUpperCase());
  if(!bur){
    SVC.forEach(([k])=>r[k]=$(k).checked?'YES':'');r.Others=$('Others').value.trim();
    r.ClientIsPatient=$('ClientIsPatient').checked?'YES':'NO';
    if(r.ClientIsPatient==='YES'){
      r.PatientName=[r.LastName+',',r.FirstName,r.MiddleName,r.ExtName].filter(Boolean).join(' ');
      r.PatientAge=r.Age;r.PatientGender=r.Gender;r.PatientStreet=r.Street;r.PatientBarangay=r.Barangay;r.PatientCity=r.City;
    }
  }
  r.AmountWords=pesos(r.AmountApproved);
  return r;
}
function fill(r){
  buildForm(r.Category);glCase=r.CaseNo||'';const bur=S.cats[cat].form==='bur';
  ALL.forEach(([k])=>{if($(k))$(k).value=r[k]||''});
  if(!bur){SVC.forEach(([k])=>$(k).checked=r[k]==='YES');$('Others').value=r.Others||'';$('ClientIsPatient').checked=r.ClientIsPatient==='YES';togglePatient()}
  calcAge();if(bur)calcDec();
  $('formTitle').textContent='Editing '+r.ControlID+' · '+S.cats[cat].label+' · correction only (assessment and case study are not changed)';
}
async function save(print){
  const r=collect(),bur=S.cats[cat].form==='bur';
  const need=bur?['LastName','FirstName','DeceasedLastName','DeceasedFirstName']:['LastName','FirstName'];
  if(need.some(k=>!r[k]))return notify(bur?'Beneficiary and deceased first and last names are required.':'Last name and first name are required.');
  if(!r.ControlID){const e=eligibility(r,cat,'',r.DateToday);
    if(!e.ok)return notify(`${S.cats[cat].label}: already availed on ${longDate(e.last.DateToday)} (${e.last.ControlID}).\nNext availment is allowed on ${longDate(e.next)}.`)}
  try{
    const saved=await run('saveRecord',r);
    const i=S.records.findIndex(x=>x.ControlID===saved.ControlID);
    i>-1?S.records[i]=saved:S.records.push(saved);
    toast('Saved '+saved.ControlID);renderAll();
    if(print){$('ControlID').value=saved.ControlID;printGL(saved)}else{pick();recCat=saved.Category;renderAll();show('recs')}
  }catch(e){notify('Could not save: '+(e.message||e))}
}

/* ---------- Views ---------- */
function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  const T={dash:['Dashboard','Overview of assistance issued'],assess:['Assessment','Intake sheet and case study come first'],entry:['Guarantee letter','Select an assessed case, then choose a category'],recs:['Records','Search, edit and print guarantee letters'],dir:['Directory','Stakeholders, contacts and social workers'],users:['Users and access','Who can use the system, requests and activity']}[v];
  $('pageTitle').textContent=T[0];$('pageSub').textContent=T[1];window.scrollTo(0,0)}
$('clock').textContent=new Date().toLocaleDateString('en-PH',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
function toast(m,type='ok'){const t=document.createElement('div');t.className='tt '+type;
  t.innerHTML=`<i>${{ok:'✓',err:'✕',info:'i'}[type]}</i><div><b>${{ok:'Success',err:'Error',info:'Notice'}[type]}</b>${esc(m)}</div><button aria-label="Close">×</button>`;
  t.querySelector('button').onclick=()=>t.remove();$('toasts').appendChild(t);setTimeout(()=>t.remove(),type==='err'?6000:3200)}
function modal(kind,msg,{ok='OK',cancel=null,danger=false}={}){return new Promise(res=>{
  const m=$('modal'),meta={warn:['!','Please check'],err:['✕','Something went wrong'],ask:['?','Please confirm']}[kind];
  m.innerHTML=`<div class="mbox" role="dialog"><div class="mhead"><i>${meta[0]}</i><b>${meta[1]}</b></div><div class="mbody">${esc(msg)}</div><div class="mfoot">${cancel?`<button class="btn alt" id="mc">${cancel}</button>`:''}<button class="btn${danger?' red':''}" id="mo">${ok}</button></div></div>`;
  m.style.display='flex';
  const kd=e=>{if(e.key==='Escape')done(false);if(e.key==='Enter'){e.preventDefault();done(true)}};
  const done=v=>{m.style.display='none';m.innerHTML='';document.removeEventListener('keydown',kd);res(v)};
  document.addEventListener('keydown',kd);$('mo').onclick=()=>done(true);if($('mc'))$('mc').onclick=()=>done(false);$('mo').focus()})}
const notify=m=>modal(/^(Could not|Failed)/.test(m)?'err':'warn',m);
const ask=(m,ok='Delete')=>modal('ask',m,{ok,cancel:'Cancel',danger:/^Delete/.test(m)});
const fullName=r=>[r.LastName+',',r.FirstName,r.MiddleName,r.ExtName].filter(Boolean).join(' ');
function bars(el,obj){const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,8),m=Math.max(1,...e.map(x=>x[1]));
  $(el).innerHTML=e.length?e.map(([k,v])=>`<div class="bar"><span>${esc(k||'-')}</span><i style="width:${v/m*100}%"></i><b>${v}</b></div>`).join(''):'<span style="color:var(--mute)">No records yet.</span>'}
function table(rows){
  if(!rows.length)return '<p style="color:var(--mute)">No records yet. Use New entry to encode the first one.</p>';
  return `<table class="t"><tr><th>Control #</th><th>Patient / Deceased</th><th>Type</th><th>Referred to</th><th>Amount</th><th>Date</th><th></th></tr>`+
  rows.map(r=>`<tr><td>${esc(r.ControlID)}</td><td>${esc(subj(r))}</td><td>${esc(r.TypeOfAssistance)}</td><td>${esc(r.ReferredTo)}</td>
  <td>${money(r.AmountApproved)}</td><td>${esc(r.DateToday)}</td>
  <td style="white-space:nowrap"><button class="btn alt" data-p="${esc(r.ControlID)}">Print</button> ${mine(r)?`<button class="btn alt" data-e="${esc(r.ControlID)}">Edit</button>`:''} ${can('ADMIN')?`<button class="btn red" data-d="${esc(r.ControlID)}">Delete</button>`:''}</td></tr>`).join('')+'</table>'}
function renderAll(){

    .map(([l,v],i)=>`<div class="stat s${i}"><em>${['📄','📅','💰','📈','🧑‍⚕️','🏥','📋'][i]}</em><div><b>${v}</b><span>${l}</span></div></div>`).join('');
  const c=(f)=>R.reduce((o,r)=>(o[r[f]]=(o[r[f]]||0)+1,o),{});
  $('catStats').innerHTML=Object.entries(S.cats).map(([k,ct],i)=>{const L=R.filter(r=>r.Category===k);
    return `<div class="stat s${[0,1,3][i]}"><em>${ICON[k]}</em><div><b>${L.length}</b><span>${ct.label} · ${money(L.reduce((a,r)=>a+Number(r.AmountApproved||0),0))}</span></div></div>`}).join('');
  bars('byType',c('TypeOfAssistance'));bars('byBrgy',c('Barangay'));
  const sorted=[...R].sort((a,b)=>(b.CreatedAt||'').localeCompare(a.CreatedAt||''));
  $('recent').innerHTML=table(sorted.slice(0,8));
  const q=$('q').value.toLowerCase();
  $('recTabs').innerHTML=[['ALL','All']].concat(Object.entries(S.cats).map(([k,ct])=>[k,ct.label])).map(([k,l])=>`<button class="btn ${k===recCat?'':'alt'}" data-rc="${k}">${l} (${k==='ALL'?R.length:R.filter(r=>r.Category===k).length})</button>`).join('');
  $('list').innerHTML=table(sorted.filter(r=>(recCat==='ALL'||r.Category===recCat)&&(!q||Object.values(r).join(' ').toLowerCase().includes(q))));

  if(b.dataset.p)printGL(find(b.dataset.p));
  if(b.dataset.e){fill(find(b.dataset.e));show('entry')}
  if(b.dataset.d&&await ask('Delete '+b.dataset.d+'? This removes the row from the sheet.')){

});

/* ---------- Guarantee letter ---------- */
const ONES=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function w(n){if(n<20)return ONES[n];if(n<100)return TENS[n/10|0]+(n%10?'-'+ONES[n%10]:'');
  if(n<1000)return ONES[n/100|0]+' hundred'+(n%100?' '+w(n%100):'');
  for(const [v,s] of [[1e9,'billion'],[1e6,'million'],[1e3,'thousand']])if(n>=v)return w(n/v|0)+' '+s+(n%v?' '+w(n%v):'')}

const addrS=r=>[r.Street,r.Barangay,r.City,r.Province].filter(Boolean).join(', ');
const ord=n=>n+(['th','st','nd','rd'][(n%100>>3^1&&n%10<4)?n%10:0]||'th');
function printCert(c){   // Social Worker's Certification (indigency)
  const d=new Date(),fm=c.Gender==='Female',own=c.BenIsClient==='YES',rel=(c.RelationToBeneficiary||'').toLowerCase(),

   <p style="${p}">This certification is issued this ${ord(d.getDate())} day of ${mon} ${d.getFullYear()} at Mabalacat City, Pampanga upon the request of the above-named person for ${esc(purpose)} and for whatever legal purposes it may serve.</p>

   <div class="ftw"><img src="${S.images.footer}"></div></div>`);

/* ---------- Availment rule: once per category every 3 months ---------- */
const addMonths=(iso,n)=>{const p=iso.split('-').map(Number),d=new Date(p[0],p[1]-1+n,1),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(p[2],last));
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)};
const ident=r=>[r.LastName,r.FirstName,r.DOB].map(x=>(x||'').trim().toUpperCase()).join('|');
function eligibility(c,catKey,ignoreId,on=today()){   // same client + same category; cancelled letters do not count
  const id=ident(c),L=S.records.filter(r=>r.Category===catKey&&r.Status!=='Cancelled'&&r.ControlID!==ignoreId&&ident(r)===id).sort((a,b)=>(b.DateToday||'').localeCompare(a.DateToday||''));
  if(!L.length)return{ok:true};
  const next=addMonths(L[0].DateToday,S.gap||3);return{ok:on>=next,last:L[0],next};
}

/* ---------- Access control: gate, roles, users ---------- */
let ME={};
const RANK={USER:1,ADMIN:2,SUPER:3},ROLE_LABEL={USER:'Social Worker',ADMIN:'Admin',SUPER:'Super Admin'};
const can=r=>(RANK[ME.role]||0)>=RANK[r];
const mine=r=>can('ADMIN')||(!!ME.email&&(r.CreatedBy||'').toLowerCase()===ME.email.toLowerCase());
let GE='';   // the e-mail typed on the sign-in screen
const noCode=r=>r==='pending'?'Your access request is still waiting for approval. You will get an e-mail once it is approved.'
  :r==='denied'?'Your access request was denied. Please contact the Super Admin.'
  :r==='disabled'?'This account is turned off. Please contact the Super Admin.'
  :'This e-mail is not registered, so no code was sent. Click "Request access" below, or use the e-mail the Super Admin added.';
function gate(state,msg){
  const box=(t,b)=>`<div class="gbox"><div class="ghead"><div class="seal">AICS</div><div><b>AICS · CSWDO Mabalacat City</b><span>${t}</span></div></div><div class="gbody">${b}</div></div>`,
    note=msg?`<p class="gmail">${esc(msg)}</p>`:'';
  const M={
    loading:box('Please wait','<p>Loading…</p>'),
    login:box('Sign in',`${note}<p>Enter your registered e-mail address. We will send a 6-digit code to it.</p><div class="gform"><label>E-mail</label><input id="gEmail" type="email" value="${esc(GE)}" autocomplete="email"></div><div class="row"><button class="btn" id="gSend">Send me a code</button></div><p class="gl2">No access yet? <a href="#" id="gReq">Request access</a></p>`),
    code:box('Enter your code',`${note}<p>We sent a 6-digit code to <b>${esc(GE)}</b>. It works for 10 minutes. If it does not arrive, check your Spam folder.</p><div class="gform"><label>6-digit code</label><input id="gCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div><div class="row"><button class="btn" id="gVerify">Sign in</button><button class="btn alt" id="gResend">Send a new code</button></div><p class="gl2"><a href="#" id="gBack">Use a different e-mail</a></p>`),
    request:box('Request access',`${note}<p>This system is for authorized CSWDO staff only. Send a request and the Super Admin will review it. You will get an e-mail once it is approved.</p><div class="gform"><label>Full name</label><input id="rqName"><label>E-mail (Google account)</label><input id="rqEmail" type="email" value="${esc(GE)}"><label>Position / office</label><input id="rqPos"><label>Message (optional)</label><textarea id="rqMsg" rows="2"></textarea></div><div class="row"><button class="btn" id="rqSend">Send request</button><button class="btn alt" id="gBack">Back</button></div>`),
    requested:box('Request sent',`<p>Your request was sent to the Super Admin. When it is approved you will receive an e-mail, and then you can sign in with your e-mail address.</p><div class="row"><button class="btn" id="gBack">Back to sign in</button></div>`)
  };
  $('gate').innerHTML=M[state]||M.login;$('gate').style.display='flex';
  const on=(id,f)=>{if($(id))$(id).onclick=async ev=>{ev.preventDefault();const b=ev.currentTarget;if(b.tagName==='BUTTON')b.disabled=true;try{await f()}finally{if(b.tagName==='BUTTON')b.disabled=false}}};
  const mail=()=>$('gEmail').value.trim().toLowerCase(),ok=m=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m);
  on('gSend',async()=>{GE=mail();if(!ok(GE))return notify('Enter a valid e-mail address.');
    try{const r=await raw('authSendCode',GE);if(r&&r.sent===false)return gate('login',noCode(r.reason));gate('code',r&&r.ver?'A code was sent to '+GE+' (server '+r.ver+'). Check your Inbox and Spam folder.':'OLD SERVER VERSION: the new Code.gs is not deployed yet. In Apps Script use Deploy > Manage deployments > Edit > New version.')}catch(e){notify('Could not send the code: '+(e.message||e))}});
  on('gVerify',async()=>{const c=$('gCode').value.trim();if(c.length!==6)return notify('Enter the 6-digit code from your e-mail.');
    try{const r=await raw('authVerifyCode',GE,c);saveTok(r.token);ME=r.me;await loadApp()}catch(e){notify('Could not sign in: '+(e.message||e))}});
  on('gResend',async()=>{try{const r=await raw('authSendCode',GE);if(r&&r.sent===false)return gate('login',noCode(r.reason));toast('A new code was sent.','info')}catch(e){notify('Could not send the code: '+(e.message||e))}});
  on('gReq',async()=>{GE=mail()||GE;gate('request')});
  on('gBack',async()=>gate('login'));
  on('rqSend',async()=>{const n=$('rqName').value.trim(),m=$('rqEmail').value.trim().toLowerCase();
    if(!n)return notify('Please enter your full name.');if(!ok(m))return notify('Enter a valid e-mail address.');
    try{GE=m;await raw('authRequestAccess',n,m,$('rqPos').value.trim(),$('rqMsg').value.trim());gate('requested')}catch(e){notify('Could not send request: '+(e.message||e))}});
}
async function boot(){
  if(!TOKEN)return gate('login');
  gate('loading');
  try{ME=await run('whoAmI')}catch(e){if(!/Session ended/.test(e.message||''))gate('login');return}
  if(ME.status==='active')return loadApp();
  saveTok('');gate('login','This account does not have active access. Request access or contact the Super Admin.');
}
async function loadApp(){
  let d;try{d=await run('getInit')}catch(e){if(!/Session ended/.test(e.message||'')){saveTok('');gate('login','Could not open the system: '+(e.message||e))}return}
  S=d;ME=Object.assign(ME,d.me);applyRole();$('gate').style.display='none';renderAll();pick();dirRender();
}
function applyRole(){
  const m=$('meBox');m.style.display='block';
  m.innerHTML=`<b>${esc(ME.name||ME.email)}</b><span class="role r${ME.role}">${ROLE_LABEL[ME.role]}</span><small>${esc(ME.email)}</small><a href="#" id="signOut">Sign out</a>`;
  $('signOut').onclick=async ev=>{ev.preventDefault();try{await raw('authSignOut',TOKEN)}catch(e){}
    saveTok('');ME={};GE='';S.records=[];S.intakes=[];S.family=[];gate('login','You have signed out.')};
  $('navUsers').style.display=can('SUPER')?'':'none';
}
let uTab='users',U=[],Rq=[],Lg=[];
async function usersLoad(){
  try{[U,Rq,Lg]=await Promise.all([run('getUsers'),run('getRequests'),run('getLog')])}catch(e){return notify('Could not load users: '+(e.message||e))}
  usersRender();
}
async function userSave(u,msg){try{await run('saveUser',u);toast(msg);usersLoad()}catch(e){notify('Could not save: '+(e.message||e))}}
document.addEventListener('change',async e=>{
  const s=e.target.closest('[data-ur]');if(!s)return;
  const u=U.find(x=>x.Email===s.dataset.ur);await userSave(Object.assign({},u,{Role:s.value}),'Role updated');
});
function usersRender(){
  const pend=Rq.filter(r=>r.Status==='Pending').length,cnt=r=>U.filter(u=>u.Role===r&&u.Status==='Active').length;
  $('usersTabs').innerHTML=[['users',`Users (${U.length})`],['reqs','Access requests'+(pend?` (${pend} pending)`:'')],['log','Activity log']].map(([k,l])=>`<button class="btn ${k===uTab?'':'alt'}" data-ut="${k}">${l}</button>`).join('');
  const rs=(sel,at)=>`<select ${at}>${Object.entries(ROLE_LABEL).map(([k,l])=>`<option value="${k}"${k===sel?' selected':''}>${l}</option>`).join('')}</select>`;
  let b='';
  if(uTab==='users')b=`<div class="card"><h2>Add a user</h2><p class="mute">They sign in with a 6-digit code sent to this e-mail. Active: ${cnt('SUPER')} Super Admin · ${cnt('ADMIN')} Admin · ${cnt('USER')} Social Worker</p>
    <div class="grid"><div><label>Google email</label><input id="uEmail" type="email" placeholder="name@gmail.com"></div><div><label>Full name</label><input id="uName"></div><div><label>Position / office</label><input id="uPos"></div><div><label>Role</label>${rs('USER','id="uRole"')}</div></div>
    <div class="row"><button class="btn" data-ua="1">Add user</button></div></div>
    <div class="card"><div class="scroll"><table class="t"><tr><th>Name</th><th>Google email</th><th>Position</th><th>Role</th><th>Status</th><th>Last sign-in</th><th></th></tr>
    ${U.map(u=>`<tr><td>${esc(u.Name)}</td><td>${esc(u.Email)}</td><td>${esc(u.Position)}</td><td>${rs(u.Role,`data-ur="${esc(u.Email)}"`)}</td><td>${esc(u.Status)}</td><td>${esc(u.LastLogin)}</td>
    <td style="white-space:nowrap"><button class="btn alt" data-us="${esc(u.Email)}">${u.Status==='Active'?'Disable':'Enable'}</button> <button class="btn red" data-ud="${esc(u.Email)}">Delete</button></td></tr>`).join('')}</table></div></div>`;
  if(uTab==='reqs')b=`<div class="card"><h2>Access requests</h2><div class="scroll">${Rq.length?`<table class="t"><tr><th>Name</th><th>Google email</th><th>Position</th><th>Message</th><th>Requested</th><th>Status</th><th>Role / action</th></tr>
    ${Rq.map(r=>`<tr><td>${esc(r.Name)}</td><td>${esc(r.Email)}</td><td>${esc(r.Position)}</td><td>${esc(r.Message)}</td><td>${esc(r.RequestedAt)}</td><td>${esc(r.Status)}</td>
    <td style="white-space:nowrap">${r.Status==='Pending'?`${rs('USER','')} <button class="btn" data-ra="${esc(r.Email)}">Approve</button> <button class="btn red" data-rd="${esc(r.Email)}">Deny</button>`:esc(r.ReviewedBy?'by '+r.ReviewedBy:'')}</td></tr>`).join('')}</table>`:'<p class="mute">No requests yet.</p>'}</div></div>`;
  if(uTab==='log')b=`<div class="card"><h2>Recent activity</h2><div class="scroll">${Lg.length?`<table class="t"><tr><th>Time</th><th>User</th><th>Role</th><th>Action</th><th>Target</th></tr>${Lg.map(l=>`<tr><td>${esc(l.Time)}</td><td>${esc(l.Email)}</td><td>${esc(l.Role)}</td><td>${esc(l.Action)}</td><td>${esc(l.Target)}</td></tr>`).join('')}</table>`:'<p class="mute">Nothing logged yet.</p>'}</div></div>`;
  $('usersBody').innerHTML=b;
}

/* ---------- Start ---------- */
boot();
